name: Generate Profile Assets (Snake & Activity Graph)

on:
  schedule:
    - cron: "0 */3 * * *" # runs every 3 hours
  workflow_dispatch: # allows manual trigger
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: bishtprateek270-hue
          outputs: |
            assets/github-snake.svg?color_snake=#10b981&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#10b981&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: bishtprateek270-hue
          output_path: assets/activity-graph.svg
          options: theme=github-compact&hide_border=true&bg_color=0d1117&color=10b981&line=10b981&point=ffffff&area=true&area_color=10b98122

      - name: Commit and Push Assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update contribution assets (snake & activity graph)"
          file_pattern: "assets/*.svg"

      - name: Purge GitHub Camo Cache
        uses: kevincobain2000/action-camo-purge@v1
