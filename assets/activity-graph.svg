<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" fill="none">
  <defs>
    <linearGradient id="area-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6c63ff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #7aa2f7; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #565f89; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #7aa2f7; }
      .grid-line { stroke: #1f2335; stroke-width: 1; stroke-dasharray: 4 4; }
      .axis-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #565f89; text-anchor: middle; }
      .axis-y { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #565f89; text-anchor: end; }
      .line { fill: none; stroke: #00d4ff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; filter: url(#glow); }
      .point { fill: #ffffff; stroke: #00d4ff; stroke-width: 2; }
      .stat-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #00d4ff; }
      .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #565f89; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="840" height="320" rx="12" fill="#0d1117" stroke="#1f2335" stroke-width="1"/>

  <!-- Header -->
  <text x="35" y="38" class="title">📈 Activity Graph</text>
  <text x="35" y="55" class="subtitle">Daily contribution telemetry &amp; commit velocity</text>

  <!-- Stats Pill Box -->
  <g transform="translate(620, 20)">
    <rect width="185" height="42" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="18" y="22" class="stat-val">560+</text>
    <text x="18" y="34" class="stat-lbl">Total Contributions</text>
    <text x="110" y="22" class="stat-val">47 Days</text>
    <text x="110" y="34" class="stat-lbl">Active Streak</text>
  </g>

  <!-- Chart Area Grid Lines -->
  <g transform="translate(45, 80)">
    <!-- Horizontal Grid Lines -->
    <line x1="15" y1="0" x2="760" y2="0" class="grid-line" />
    <text x="8" y="4" class="axis-y">15</text>

    <line x1="15" y1="45" x2="760" y2="45" class="grid-line" />
    <text x="8" y="49" class="axis-y">10</text>

    <line x1="15" y1="90" x2="760" y2="90" class="grid-line" />
    <text x="8" y="94" class="axis-y">5</text>

    <line x1="15" y1="135" x2="760" y2="135" stroke="#21262d" stroke-width="1.5" />
    <text x="8" y="139" class="axis-y">0</text>

    <!-- Shaded Area -->
    <path d="M 25 135 
             L 25 105 
             L 50 115 
             L 75 90 
             L 100 80 
             L 125 100 
             L 150 70 
             L 175 60 
             L 200 75 
             L 225 50 
             L 250 65 
             L 275 40 
             L 300 55 
             L 325 35 
             L 350 45 
             L 375 30 
             L 400 40 
             L 425 25 
             L 450 35 
             L 475 20 
             L 500 30 
             L 525 15 
             L 550 25 
             L 575 18 
             L 600 28 
             L 625 12 
             L 650 20 
             L 675 15 
             L 700 22 
             L 725 10 
             L 750 8 
             L 750 135 Z" fill="url(#area-gradient)" />

    <!-- Line Path -->
    <path d="M 25 105 
             L 50 115 
             L 75 90 
             L 100 80 
             L 125 100 
             L 150 70 
             L 175 60 
             L 200 75 
             L 225 50 
             L 250 65 
             L 275 40 
             L 300 55 
             L 325 35 
             L 350 45 
             L 375 30 
             L 400 40 
             L 425 25 
             L 450 35 
             L 475 20 
             L 500 30 
             L 525 15 
             L 550 25 
             L 575 18 
             L 600 28 
             L 625 12 
             L 650 20 
             L 675 15 
             L 700 22 
             L 725 10 
             L 750 8" class="line" />

    <!-- Data Points -->
    <circle cx="25" cy="105" r="3.5" class="point" />
    <circle cx="100" cy="80" r="3.5" class="point" />
    <circle cx="175" cy="60" r="3.5" class="point" />
    <circle cx="250" cy="65" r="3.5" class="point" />
    <circle cx="325" cy="35" r="3.5" class="point" />
    <circle cx="400" cy="40" r="3.5" class="point" />
    <circle cx="475" cy="20" r="3.5" class="point" />
    <circle cx="550" cy="25" r="3.5" class="point" />
    <circle cx="625" cy="12" r="3.5" class="point" />
    <circle cx="700" cy="22" r="3.5" class="point" />
    <circle cx="750" cy="8" r="4.5" class="point" fill="#00d4ff" />

    <!-- X-Axis Labels -->
    <text x="25" y="160" class="axis-text">Aug 20</text>
    <text x="145" y="160" class="axis-text">Aug 25</text>
    <text x="265" y="160" class="axis-text">Aug 30</text>
    <text x="385" y="160" class="axis-text">Sep 04</text>
    <text x="505" y="160" class="axis-text">Sep 09</text>
    <text x="625" y="160" class="axis-text">Sep 14</text>
    <text x="745" y="160" class="axis-text">Today</text>
  </g>

  <!-- Legend / Highlights -->
  <g transform="translate(45, 275)">
    <circle cx="6" cy="6" r="4" fill="#00d4ff" />
    <text x="16" y="10" class="legend-text">Commit &amp; PR Velocity</text>

    <circle cx="160" cy="6" r="4" fill="#6c63ff" />
    <text x="170" y="10" class="legend-text">Consistent Daily Cadence</text>

    <circle cx="330" cy="6" r="4" fill="#2ea043" />
    <text x="340" y="10" class="legend-text">Active Streak: 47+ Days</text>
  </g>
</svg>
